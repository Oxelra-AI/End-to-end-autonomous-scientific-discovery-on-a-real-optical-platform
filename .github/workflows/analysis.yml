name: Offline analysis

on:
  push:
    paths:
      - 'analysis/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/analysis.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m analysis.result4 --help
      - run: python -m analysis.budgets --help
      - run: python -m analysis.phase_readout --help
      - run: python -m analysis.summarize --help
